<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý bài tập - StudentHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/static/dashboard.html">📚 StudentHub</a>
        <div class="d-flex gap-2">
            <a href="/static/subjects.html" class="btn btn-outline-light btn-sm">Môn học</a>
            <button class="btn btn-outline-light btn-sm" onclick="logout()">Đăng xuất</button>
        </div>
    </div>
</nav>

<main class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
        <div>
            <h2 class="mb-1">Quản lý bài tập</h2>
            <p class="text-muted mb-0">Tạo, cập nhật, lọc và xóa bài tập của bạn.</p>
        </div>
        <button class="btn btn-primary" onclick="openCreateModal()">+ Thêm bài tập</button>
    </div>

    <div id="alertMessage" class="alert d-none" role="alert"></div>

    <div class="card shadow-sm mb-3">
        <div class="card-body">
            <div class="row g-2">
                <div class="col-md-6">
                    <label class="form-label" for="filterSubject">Lọc theo môn học</label>
                    <select id="filterSubject" class="form-select" onchange="loadTasks()">
                        <option value="">Tất cả môn học</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="filterStatus">Lọc theo trạng thái</label>
                    <select id="filterStatus" class="form-select" onchange="loadTasks()">
                        <option value="">Tất cả trạng thái</option>
                        <option value="TODO">Chưa làm</option>
                        <option value="IN_PROGRESS">Đang làm</option>
                        <option value="DONE">Hoàn thành</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th>Tiêu đề</th>
                        <th>Môn học</th>
                        <th>Hạn nộp</th>
                        <th>Trạng thái</th>
                        <th class="text-end">Thao tác</th>
                    </tr>
                </thead>
                <tbody id="taskTableBody">
                    <tr><td colspan="5" class="text-center py-4">Đang tải dữ liệu...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<div class="modal fade" id="taskModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="taskForm">
                <div class="modal-header">
                    <h5 class="modal-title" id="taskModalTitle">Thêm bài tập</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="taskId">
                    <div class="mb-3">
                        <label class="form-label" for="taskTitle">Tiêu đề</label>
                        <input class="form-control" id="taskTitle" minlength="2" maxlength="255" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="taskDescription">Mô tả</label>
                        <textarea class="form-control" id="taskDescription" rows="3"></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="taskSubject">Môn học</label>
                        <select class="form-select" id="taskSubject" required></select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="taskDueDate">Hạn nộp</label>
                        <input type="datetime-local" class="form-control" id="taskDueDate">
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="taskStatus">Trạng thái</label>
                        <select class="form-select" id="taskStatus">
                            <option value="TODO">Chưa làm</option>
                            <option value="IN_PROGRESS">Đang làm</option>
                            <option value="DONE">Hoàn thành</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                    <button type="submit" class="btn btn-primary">Lưu bài tập</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const token = localStorage.getItem("access_token");
if (!token) window.location.href = "/static/login.html";

const modal = new bootstrap.Modal(document.getElementById("taskModal"));
let subjects = [];
let tasks = [];

function authHeaders(json = false) {
    const headers = { "Authorization": `Bearer ${token}` };
    if (json) headers["Content-Type"] = "application/json";
    return headers;
}
function showAlert(message, type = "success") {
    const box = document.getElementById("alertMessage");
    box.className = `alert alert-${type}`;
    box.textContent = message;
    box.classList.remove("d-none");
}
function escapeHtml(value) {
    return String(value ?? "").replace(/[&<>"']/g, ch => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
    }[ch]));
}
function logout() {
    localStorage.removeItem("access_token");
    window.location.href = "/static/login.html";
}
function formatDate(value) {
    if (!value) return "Chưa đặt hạn";
    return new Date(value).toLocaleString("vi-VN");
}
function statusBadge(status) {
    const map = {
        TODO: ["Chưa làm", "secondary"],
        IN_PROGRESS: ["Đang làm", "warning"],
        DONE: ["Hoàn thành", "success"]
    };
    const item = map[status] || [status, "secondary"];
    return `<span class="badge text-bg-${item[1]}">${item[0]}</span>`;
}
async function loadSubjects() {
    const response = await fetch("/subjects/", { headers: authHeaders() });
    if (response.status === 401) return logout();
    if (!response.ok) throw new Error("Không tải được danh sách môn học.");
    subjects = await response.json();

    const filter = document.getElementById("filterSubject");
    const select = document.getElementById("taskSubject");
    filter.innerHTML = '<option value="">Tất cả môn học</option>';
    select.innerHTML = "";
    subjects.forEach(subject => {
        const label = `${subject.code} - ${subject.name}`;
        filter.add(new Option(label, subject.id));
        select.add(new Option(label, subject.id));
    });
}
async function loadTasks() {
    const body = document.getElementById("taskTableBody");
    const params = new URLSearchParams();
    const subjectId = document.getElementById("filterSubject").value;
    const taskStatus = document.getElementById("filterStatus").value;
    if (subjectId) params.set("subject_id", subjectId);
    if (taskStatus) params.set("task_status", taskStatus);

    try {
        const response = await fetch(`/tasks/?${params.toString()}`, { headers: authHeaders() });
        if (response.status === 401) return logout();
        if (!response.ok) throw new Error("Không tải được bài tập.");
        tasks = await response.json();
        const subjectMap = Object.fromEntries(subjects.map(s => [s.id, s.name]));
        if (!tasks.length) {
            body.innerHTML = '<tr><td colspan="5" class="text-center text-muted py-4">Chưa có bài tập phù hợp.</td></tr>';
            return;
        }
        body.innerHTML = tasks.map(task => `
            <tr>
                <td><strong>${escapeHtml(task.title)}</strong><div class="small text-muted">${escapeHtml(task.description || "")}</div></td>
                <td>${escapeHtml(subjectMap[task.subject_id] || "Không xác định")}</td>
                <td>${escapeHtml(formatDate(task.due_date))}</td>
                <td>${statusBadge(task.status)}</td>
                <td class="text-end text-nowrap">
                    <button class="btn btn-sm btn-outline-primary me-1" onclick="openEditModal(${task.id})">Sửa</button>
                    <button class="btn btn-sm btn-outline-danger" onclick="deleteTask(${task.id})">Xóa</button>
                </td>
            </tr>
        `).join("");
    } catch (error) {
        showAlert(error.message, "danger");
    }
}
function openCreateModal() {
    if (!subjects.length) return showAlert("Bạn cần tạo môn học trước khi thêm bài tập.", "warning");
    document.getElementById("taskForm").reset();
    document.getElementById("taskId").value = "";
    document.getElementById("taskModalTitle").textContent = "Thêm bài tập";
    document.getElementById("taskStatus").value = "TODO";
    modal.show();
}
function openEditModal(id) {
    const task = tasks.find(item => item.id === id);
    if (!task) return;
    document.getElementById("taskId").value = task.id;
    document.getElementById("taskTitle").value = task.title;
    document.getElementById("taskDescription").value = task.description || "";
    document.getElementById("taskSubject").value = task.subject_id;
    document.getElementById("taskDueDate").value = task.due_date ? task.due_date.slice(0, 16) : "";
    document.getElementById("taskStatus").value = task.status;
    document.getElementById("taskModalTitle").textContent = "Cập nhật bài tập";
    modal.show();
}
document.getElementById("taskForm").addEventListener("submit", async event => {
    event.preventDefault();
    const id = document.getElementById("taskId").value;
    const dueDate = document.getElementById("taskDueDate").value;
    const payload = {
        title: document.getElementById("taskTitle").value.trim(),
        description: document.getElementById("taskDescription").value.trim() || null,
        subject_id: Number(document.getElementById("taskSubject").value),
        due_date: dueDate ? `${dueDate}:00` : null,
        status: document.getElementById("taskStatus").value
    };
    try {
        const response = await fetch(id ? `/tasks/${id}` : "/tasks/", {
            method: id ? "PUT" : "POST",
            headers: authHeaders(true),
            body: JSON.stringify(payload)
        });
        const data = response.status === 204 ? null : await response.json();
        if (!response.ok) throw new Error(data?.detail || "Không thể lưu bài tập.");
        modal.hide();
        showAlert(id ? "Cập nhật bài tập thành công." : "Tạo bài tập thành công.");
        await loadTasks();
    } catch (error) {
        showAlert(error.message, "danger");
    }
});
async function deleteTask(id) {
    if (!confirm("Bạn chắc chắn muốn xóa bài tập này?")) return;
    const response = await fetch(`/tasks/${id}`, {
        method: "DELETE",
        headers: authHeaders()
    });
    if (response.status === 204) {
        showAlert("Xóa bài tập thành công.");
        loadTasks();
    } else {
        const data = await response.json().catch(() => ({}));
        showAlert(data.detail || "Không thể xóa bài tập.", "danger");
    }
}
(async function init() {
    try {
        await loadSubjects();
        await loadTasks();
    } catch (error) {
        showAlert(error.message, "danger");
    }
})();
</script>
</body>
</html>
