<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Bài tập - LMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-2xl font-bold mb-6 text-gray-800">Quản lý Bài tập (Tasks)</h1>

        <!-- Form Thêm bài tập -->
        <div class="bg-white p-6 rounded-lg shadow-md mb-6">
            <h2 class="text-lg font-semibold mb-4">Thêm bài tập mới</h2>
            <form id="create-task-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Tiêu đề bài tập</label>
                    <input type="text" id="task-title" required class="mt-1 block w-full p-2 border rounded-md">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Mô tả</label>
                    <textarea id="task-desc" class="mt-1 block w-full p-2 border rounded-md"></textarea>
                </div>
                <div class="grid grid-cols-3 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Hạn nộp</label>
                        <input type="datetime-local" id="task-duedate" class="mt-1 block w-full p-2 border rounded-md">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Trạng thái</label>
                        <select id="task-status" class="mt-1 block w-full p-2 border rounded-md">
                            <option value="pending">Pending</option>
                            <option value="completed">Completed</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">ID Môn học</label>
                        <input type="number" id="task-subject-id" required class="mt-1 block w-full p-2 border rounded-md">
                    </div>
                </div>
                <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700">Tạo bài tập</button>
            </form>
        </div>

        <!-- Danh sách bài tập -->
        <div class="bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-lg font-semibold mb-4">Danh sách bài tập của tôi</h2>
            <div id="task-list-container">
                <!-- Dữ liệu render tự động bằng JS -->
            </div>
        </div>
    </div>

    <!-- Nhúng file JS vừa tạo -->
    <script src="/static/js/tasks.js"></script>
</body>
</html>
