<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tài khoản - StudentHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/style.css?v=10" rel="stylesheet">
    <style>
        @keyframes fieldSlideIn {
            0% {
                opacity: 0;
                transform: translateY(16px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .register-field-group {
            opacity: 0;
            animation: fieldSlideIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .register-field-group:nth-child(1) { animation-delay: 0.12s; }
        .register-field-group:nth-child(2) { animation-delay: 0.2s; }
        .register-field-group:nth-child(3) { animation-delay: 0.28s; }
        .register-submit-wrap {
            opacity: 0;
            animation: fieldSlideIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.36s forwards;
        }

        .password-input-wrap {
            position: relative;
        }

        .password-toggle-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            color: #64748b;
            font-size: 0.95rem;
            padding: 4px 6px;
            cursor: pointer;
            transition: color 0.2s ease, transform 0.2s ease;
        }

        .password-toggle-btn:hover {
            color: #2563eb;
            transform: translateY(-50%) scale(1.1);
        }
    </style>
</head>
<body>

<div class="auth-bg-shapes">
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
</div>

<div class="card register-card p-4 p-sm-5" id="registerCard">
    <div class="auth-logo-badge">🎓</div>
    <h3 class="text-center fw-bold text-primary mb-1">Đăng Ký Tài Khoản</h3>
    <p class="text-center text-muted small mb-4">Tạo không gian học tập thông minh cùng StudentHub</p>

    <div id="alertMessage" class="alert d-none" role="alert"></div>

    <form id="registerForm" novalidate>
        <div class="mb-3 register-field-group">
            <label for="fullName" class="form-label fw-semibold">Họ và tên</label>
            <input type="text" class="form-control" id="fullName" placeholder="Nguyễn Văn A" required>
            <div id="fullNameError" class="invalid-feedback">Vui lòng nhập họ và tên.</div>
        </div>

        <div class="mb-3 register-field-group">
            <label for="email" class="form-label fw-semibold">Địa chỉ Email</label>
            <input type="email" class="form-control" id="email" placeholder="example@gmail.com" required>
            <div id="emailError" class="invalid-feedback">Email không hợp lệ hoặc đã tồn tại.</div>
        </div>

        <div class="mb-3 register-field-group">
            <label for="password" class="form-label fw-semibold">Mật khẩu</label>
            <div class="password-input-wrap">
                <input type="password" class="form-control pe-5" id="password" placeholder="Tối thiểu 6 ký tự" required minlength="6">
                <button type="button" class="password-toggle-btn" id="togglePasswordBtn" aria-label="Hiện mật khẩu">👁️</button>
            </div>
            <div id="passwordError" class="invalid-feedback">Mật khẩu phải từ 6 ký tự trở lên.</div>
        </div>

        <div class="register-submit-wrap">
            <button type="submit" id="btnSubmit" class="btn btn-primary w-100 py-2 mt-2">
                Đăng Ký Ngay
            </button>
        </div>
    </form>

    <div class="text-center mt-4">
        <small class="text-muted">Đã có tài khoản? <a href="/static/login.html" class="fw-semibold text-decoration-none">Đăng nhập</a></small>
    </div>
</div>

<div class="login-transition-overlay" id="registerTransitionOverlay">
    <div class="transition-stage">
        <div class="success-icon-stage">
            <svg class="success-svg" viewBox="0 0 80 80">
                <circle class="success-svg-circle" cx="40" cy="40" r="36"></circle>
                <path class="success-svg-check" d="M24 41 L35 52 L56 29"></path>
            </svg>
        </div>
        <div class="transition-title">Tạo tài khoản thành công!</div>
        <div class="transition-user-pill" id="transitionNewUser">student@studenthub.edu.vn</div>
        <div class="transition-subtitle">Đang chuyển hướng sang cổng đăng nhập StudentHub...</div>
        <div class="transition-bar-track">
            <div class="transition-bar-fill"></div>
        </div>
    </div>
</div>

<script src="/static/js/register.js?v=10"></script>
<script src="/static/js/animations.js?v=10"></script>
</body>
</html>
