<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập hệ thống</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
</head>
<body>

<div class="card register-card p-4 bg-white">
    <h3 class="text-center text-primary mb-3">Đăng Nhập</h3>
    <div id="alertMessage" class="alert d-none" role="alert"></div>

    <form id="loginForm">
        <div class="mb-3">
            <label class="form-label fw-bold">Email</label>
            <input type="email" class="form-control" id="email" required>
        </div>
        <div class="mb-3">
            <label class="form-label fw-bold">Mật khẩu</label>
            <input type="password" class="form-control" id="password" required>
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2 mt-2">Đăng Nhập</button>
    </form>
    <div class="text-center mt-3">
        <small>Chưa có tài khoản? <a href="/static/register.html">Đăng ký ngay</a></small>
    </div>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', async function (e) {
        e.preventDefault();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const alertMsg = document.getElementById('alertMessage');
        alertMsg.classList.add('d-none');

        // Bắt buộc gửi dạng URL Encoded Form Data
        const formData = new URLSearchParams();
        formData.append('username', email);
        formData.append('password', password);

        try {
            const response = await fetch('/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: formData.toString()
            });
            const data = await response.json();

            if (response.ok) {
                // STT 12: Lưu Token ở Client
                localStorage.setItem('access_token', data.access_token);
                alertMsg.className = 'alert alert-success mt-3';
                alertMsg.innerText = 'Thành công! Đang chuyển hướng...';
                
                setTimeout(() => window.location.href = '/static/dashboard.html', 1500);
            } else {
                alertMsg.className = 'alert alert-danger mt-3';
                alertMsg.innerText = data.detail || 'Sai thông tin đăng nhập';
            }
        } catch (err) {
            alertMsg.className = 'alert alert-danger mt-3';
            alertMsg.innerText = 'Lỗi kết nối máy chủ';
        }
    });
</script>
</body>
</html>
