<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập hệ thống - StudentHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/style.css?v=9" rel="stylesheet">
</head>
<body>

<div class="auth-bg-shapes">
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
</div>

<div class="card register-card p-4 p-sm-5" id="loginCard">
    <div class="auth-logo-badge">📚</div>
    <h3 class="text-center fw-bold text-primary mb-1">Đăng Nhập</h3>
    <p class="text-center text-muted small mb-4">Chào mừng bạn quay trở lại với StudentHub</p>

    <div id="alertMessage" class="alert d-none" role="alert"></div>

    <form id="loginForm">
        <div class="mb-3">
            <label for="email" class="form-label fw-semibold">Email</label>
            <input type="email" class="form-control" id="email" placeholder="example@gmail.com" required>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label fw-semibold">Mật khẩu</label>
            <input type="password" class="form-control" id="password" placeholder="Nhập mật khẩu của bạn" required>
        </div>
        <button type="submit" id="loginSubmitBtn" class="btn btn-primary w-100 py-2 mt-2">Đăng Nhập</button>
    </form>

    <div class="text-center mt-4">
        <small class="text-muted">Chưa có tài khoản? <a href="/static/register.html">Đăng ký ngay</a></small>
    </div>
</div>

<div class="login-transition-overlay" id="loginTransitionOverlay">
    <div class="transition-stage">
        <div class="success-icon-stage">
            <svg class="success-svg" viewBox="0 0 80 80">
                <circle class="success-svg-circle" cx="40" cy="40" r="36"></circle>
                <path class="success-svg-check" d="M24 41 L35 52 L56 29"></path>
            </svg>
        </div>
        <div class="transition-title">Đăng nhập thành công!</div>
        <div class="transition-user-pill" id="transitionUserEmail">student@studenthub.edu.vn</div>
        <div class="transition-subtitle">Đang khởi tạo không gian học tập StudentHub...</div>
        <div class="transition-bar-track">
            <div class="transition-bar-fill"></div>
        </div>
    </div>
</div>

<script>
    function playLoginSuccessTransition(email) {
        const card = document.getElementById('loginCard');
        const overlay = document.getElementById('loginTransitionOverlay');
        const emailBadge = document.getElementById('transitionUserEmail');

        emailBadge.innerText = email;
        sessionStorage.setItem('studenthub_just_logged_in', '1');

        card.classList.add('card-morph-out');

        requestAnimationFrame(() => {
            overlay.classList.add('active');
        });

        setTimeout(() => {
            overlay.classList.add('merge-to-dashboard');
        }, 1650);

        setTimeout(() => {
            window.location.href = '/static/dashboard.html';
        }, 1950);
    }

    document.getElementById('loginForm').addEventListener('submit', async function (e) {
        e.preventDefault();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const alertMsg = document.getElementById('alertMessage');
        const submitBtn = document.getElementById('loginSubmitBtn');

        alertMsg.classList.add('d-none');
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="btn-loading-spinner"></span>Đang xác thực...';

        const formData = new URLSearchParams();
        formData.append('username', email);
        formData.append('password', password);

        try {
            const response = await fetch('http://127.0.0.1:8000/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: formData.toString()
            });
            const data = await response.json();

            if (response.ok) {
                localStorage.setItem('access_token', data.access_token);
                playLoginSuccessTransition(email);
            } else {
                submitBtn.disabled = false;
                submitBtn.innerText = 'Đăng Nhập';
                alertMsg.className = 'alert alert-danger mt-3';
                alertMsg.innerText = data.detail || 'Sai thông tin đăng nhập';
            }
        } catch (err) {
            submitBtn.disabled = false;
            submitBtn.innerText = 'Đăng Nhập';
            alertMsg.className = 'alert alert-danger mt-3';
            alertMsg.innerText = 'Lỗi kết nối máy chủ';
        }
    });
</script>
</body>
</html>
