<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Môn học - LMS</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>📚 Quản lý Danh sách Môn học</h2>
            <!-- Nút mở Modal Thêm môn học -->
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#subjectModal">
                + Thêm Môn Học
            </button>
        </div>

        <!-- Bảng danh sách môn học -->
        <div class="card shadow-sm">
            <div class="card-body">
                <table class="table table-hover align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Tên Môn Học</th>
                            <th>Mô tả</th>
                            <th>Thao tác</th>
                        </tr>
                    </thead>
                    <tbody id="subjectTableBody">
                        <!-- Dữ liệu sẽ được load tự động bằng JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal Thêm/Sửa Môn Học -->
    <div class="modal fade" id="subjectModal" tabindex="-1" aria-labelledby="subjectModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="subjectForm">
                    <div class="modal-header">
                        <h5 class="modal-title" id="subjectModalLabel">Thêm Môn Học Mới</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" id="subjectId">
                        <div class="mb-3">
                            <label for="name" class="form-label">Tên môn học</label>
                            <input type="text" class="form-control" id="name" required>
                        </div>
                        <div class="mb-3">
                            <label for="description" class="form-label">Mô tả</label>
                            <textarea class="form-control" id="description" rows="3"></textarea>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                        <button type="submit" class="btn btn-success">Lưu lại</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_URL = "http://127.0.0.1:8000/subjects";

        // Hàm tải danh sách môn học từ FastAPI
        async function loadSubjects() {
            try {
                const response = await fetch(API_URL);
                const subjects = await response.json();
                const tbody = document.getElementById("subjectTableBody");
                tbody.innerHTML = "";

                subjects.forEach(sub => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${sub.id}</td>
                            <td><strong>${sub.name}</strong></td>
                            <td>${sub.description || "Không có mô tả"}</td>
                            <td>
                                <button class="btn btn-sm btn-outline-primary me-1">Sửa</button>
                                <button class="btn btn-sm btn-outline-danger">Xóa</button>
                            </td>
                        </tr>
                    `;
                });
            } catch (error) {
                console.error("Lỗi khi tải dữ liệu môn học:", error);
            }
        }

        // Xử lý submit form thêm môn học
        document.getElementById("subjectForm").addEventListener("submit", async function(e) {
            e.preventDefault();
            const name = document.getElementById("name").value;
            const description = document.getElementById("description").value;

            const response = await fetch(API_URL + "/", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    // "Authorization": "Bearer " + localStorage.getItem("token") // Thêm token nếu cần bảo mật
                },
                body: JSON.stringify({ name, description })
            });

            if (response.ok) {
                // Đóng modal và tải lại bảng
                const modal = bootstrap.Modal.getInstance(document.getElementById("subjectModal"));
                modal.hide();
                document.getElementById("subjectForm").reset();
                loadSubjects();
            } else {
                alert("Có lỗi xảy ra khi thêm môn học!");
            }
        });

        // Tải danh sách khi load trang
        loadSubjects();
    </script>
</body>
</html>
