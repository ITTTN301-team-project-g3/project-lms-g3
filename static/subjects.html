<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Môn học - StudentHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">📚 StudentHub</a>
            <button class="btn btn-outline-light btn-sm" onclick="logout()">Đăng xuất</button>
        </div>
    </nav>

    <div class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Quản lý Danh sách Môn học</h2>
            <button class="btn btn-primary" onclick="openCreateModal()">
                + Thêm Môn Học
            </button>
        </div>

        <div class="card shadow-sm">
            <div class="card-body">
                <table class="table table-hover align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Mã Môn</th>
                            <th>Tên Môn Học</th>
                            <th>Mô tả</th>
                            <th class="text-center">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody id="subjectTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal Thêm/Sửa Môn Học -->
    <div class="modal fade" id="subjectModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="subjectForm">
                    <div class="modal-header">
                        <h5 class="modal-title" id="subjectModalLabel">Thêm Môn Học Mới</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" id="subjectId">
                        <div class="mb-3">
                            <label for="code" class="form-label">Mã môn học</label>
                            <input type="text" class="form-control" id="code" required placeholder="VD: INT1340">
                        </div>
                        <div class="mb-3">
                            <label for="name" class="form-label">Tên môn học</label>
                            <input type="text" class="form-control" id="name" required placeholder="VD: Công nghệ phần mềm">
                        </div>
                        <div class="mb-3">
                            <label for="description" class="form-label">Mô tả</label>
                            <textarea class="form-control" id="description" rows="3"></textarea>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                        <button type="submit" class="btn btn-success">Lưu lại</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_URL = "/subjects/";
        const token = localStorage.getItem("token");
        const subjectModal = new bootstrap.Modal(document.getElementById("subjectModal"));
        let currentSubjects = [];

        if (!token) {
            alert("Vui lòng đăng nhập trước!");
            window.location.href = "/static/login.html";
        }

        function getAuthHeaders() {
            return {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${token}`
            };
        }

        // 1. Tải danh sách môn học (GET)
        async function loadSubjects() {
            try {
                const response = await fetch(API_URL, {
                    headers: getAuthHeaders()
                });

                if (response.status === 401) {
                    logout();
                    return;
                }

                currentSubjects = await response.json();
                const tbody = document.getElementById("subjectTableBody");
                tbody.innerHTML = "";

                currentSubjects.forEach(sub => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${sub.id}</td>
                            <td><span class="badge bg-secondary">${sub.code}</span></td>
                            <td><strong>${sub.name}</strong></td>
                            <td>${sub.description || '<span class="text-muted">Không có mô tả</span>'}</td>
                            <td class="text-center">
                                <button class="btn btn-sm btn-outline-primary me-1" onclick="openEditModal(${sub.id})">Sửa</button>
                                <button class="btn btn-sm btn-outline-danger" onclick="deleteSubject(${sub.id})">Xóa</button>
                            </td>
                        </tr>
                    `;
                });
            } catch (error) {
                console.error("Lỗi khi tải dữ liệu môn học:", error);
            }
        }

        // Mở Modal Thêm mới
        function openCreateModal() {
            document.getElementById("subjectModalLabel").innerText = "Thêm Môn Học Mới";
            document.getElementById("subjectForm").reset();
            document.getElementById("subjectId").value = "";
            subjectModal.show();
        }

        // Mở Modal Sửa
        function openEditModal(id) {
            const sub = currentSubjects.find(item => item.id === id);
            if (!sub) return;

            document.getElementById("subjectModalLabel").innerText = "Cập Nhật Môn Học";
            document.getElementById("subjectId").value = sub.id;
            document.getElementById("code").value = sub.code;
            document.getElementById("name").value = sub.name;
            document.getElementById("description").value = sub.description || "";
            subjectModal.show();
        }

        // 2. Xử lý Submit Form (Tạo mới POST hoặc Cập nhật PUT)
        document.getElementById("subjectForm").addEventListener("submit", async function(e) {
            e.preventDefault();
            const id = document.getElementById("subjectId").value;
            const payload = {
                code: document.getElementById("code").value.trim(),
                name: document.getElementById("name").value.trim(),
                description: document.getElementById("description").value.trim() || null
            };

            const method = id ? "PUT" : "POST";
            const url = id ? `${API_URL}${id}` : API_URL;

            try {
                const response = await fetch(url, {
                    method: method,
                    headers: getAuthHeaders(),
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    subjectModal.hide();
                    document.getElementById("subjectForm").reset();
                    loadSubjects();
                } else {
                    const err = await response.json();
                    alert("Lỗi: " + (err.detail || "Thao tác thất bại!"));
                }
            } catch (error) {
                console.error("Lỗi khi lưu môn học:", error);
            }
        });

        // 3. Xóa môn học (DELETE)
        async function deleteSubject(id) {
            if (!confirm("Bạn có chắc chắn muốn xóa môn học này không?")) return;

            try {
                const response = await fetch(`${API_URL}${id}`, {
                    method: "DELETE",
                    headers: getAuthHeaders()
                });

                if (response.ok) {
                    loadSubjects();
                } else {
                    const err = await response.json();
                    alert(err.detail || "Không thể xóa môn học!");
                }
            } catch (error) {
                console.error("Lỗi khi xóa môn học:", error);
            }
        }

        function logout() {
            localStorage.removeItem("token");
            window.location.href = "/static/login.html";
        }

        loadSubjects();
    </script>
</body>
</html>
