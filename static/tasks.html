<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Bài tập - StudentHub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-gray-100 min-h-screen">
    <!-- Thanh điều hướng -->
    <nav class="bg-gray-900 text-white px-6 py-4 mb-8 shadow">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-6">
                <span class="font-bold text-lg">📚 StudentHub</span>
                <a href="/static/subjects.html" class="text-gray-300 hover:text-white text-sm">Môn học</a>
                <a href="/static/tasks.html" class="text-white font-semibold text-sm border-b-2 border-blue-500 pb-1">Bài tập</a>
            </div>
            <button onclick="logout()" class="px-3 py-1 border border-gray-500 rounded text-sm hover:bg-gray-800">Đăng xuất</button>
        </div>
    </nav>

    <div class="max-w-4xl mx-auto px-4 pb-12">
        <!-- Header + Nút mở Modal Thêm bài tập -->
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-gray-800">Quản lý Bài tập (Tasks)</h1>
            <button onclick="openCreateModal()" class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 font-medium shadow-sm">
                + Thêm bài tập
            </button>
        </div>

        <!-- Danh sách & Bộ lọc bài tập -->
        <div class="bg-white p-6 rounded-lg shadow-md">
            <div class="flex flex-col md:flex-row md:items-center justify-between mb-4 gap-3">
                <h2 class="text-lg font-semibold text-gray-800">Danh sách bài tập của tôi</h2>
                <div class="flex flex-wrap gap-2">
                    <select id="filter-subject" onchange="fetchTasks()" class="p-2 border rounded-md text-sm bg-white">
                        <option value="">Tất cả môn học</option>
                    </select>
                    <select id="filter-status" onchange="fetchTasks()" class="p-2 border rounded-md text-sm bg-white">
                        <option value="">Tất cả trạng thái</option>
                        <option value="TODO">TODO</option>
                        <option value="IN_PROGRESS">IN_PROGRESS</option>
                        <option value="DONE">DONE</option>
                    </select>
                </div>
            </div>
            <div id="task-list-container"></div>
        </div>
    </div>

    <!-- Modal UI Dùng Chung Cho Thêm & Sửa Bài Tập -->
    <div id="task-modal" onclick="if (event.target === this) closeTaskModal()" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white p-6 rounded-lg shadow-xl w-full max-w-md mx-4">
            <div class="flex justify-between items-center border-b pb-3 mb-4">
                <h3 id="modal-title" class="text-lg font-bold text-gray-800">Thêm bài tập mới</h3>
                <button type="button" onclick="closeTaskModal()" class="text-gray-400 hover:text-gray-600 text-2xl leading-none">&times;</button>
            </div>

            <form id="task-form" class="space-y-4">
                <input type="hidden" id="task-id">

                <div>
                    <label class="block text-sm font-medium text-gray-700">Tiêu đề bài tập <span class="text-red-500">*</span></label>
                    <input type="text" id="task-title" required minlength="2" maxlength="255" class="mt-1 block w-full p-2 border rounded-md" placeholder="VD: Hoàn thành báo cáo Sprint 2">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">Mô tả</label>
                    <textarea id="task-desc" rows="3" class="mt-1 block w-full p-2 border rounded-md" placeholder="Chi tiết yêu cầu bài tập..."></textarea>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">Môn học <span class="text-red-500">*</span></label>
                    <select id="task-subject-id" required class="mt-1 block w-full p-2 border rounded-md bg-white">
                        <option value="">-- Chọn môn học --</option>
                    </select>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Hạn nộp</label>
                        <input type="datetime-local" id="task-duedate" class="mt-1 block w-full p-2 border rounded-md">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Trạng thái</label>
                        <select id="task-status" class="mt-1 block w-full p-2 border rounded-md bg-white">
                            <option value="TODO">Chưa làm (TODO)</option>
                            <option value="IN_PROGRESS">Đang làm (IN_PROGRESS)</option>
                            <option value="DONE">Hoàn thành (DONE)</option>
                        </select>
                    </div>
                </div>

                <div class="flex justify-end space-x-2 pt-3 border-t">
                    <button type="button" onclick="closeTaskModal()" class="px-4 py-2 bg-gray-200 text-gray-800 rounded-md hover:bg-gray-300">Hủy</button>
                    <button type="submit" id="modal-submit-btn" class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 font-medium">Lưu bài tập</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/static/js/tasks.js"></script>
</body>
</html>
