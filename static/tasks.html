<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Bài tập - StudentHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/style.css?v=3" rel="stylesheet">
</head>
<body class="app-layout">

    <nav class="navbar navbar-dark top-navbar py-3">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand fw-bold fs-5 mb-0" href="/static/dashboard.html">📚 StudentHub</a>
            <div class="d-flex align-items-center gap-2">
                <a href="/static/dashboard.html" class="nav-link-btn">Dashboard</a>
                <a href="/static/subjects.html" class="nav-link-btn">Môn học</a>
                <a href="/static/tasks.html" class="nav-link-btn active">Bài tập</a>
                <button class="btn btn-outline-danger btn-sm ms-2" id="logoutBtn">Đăng xuất</button>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-2">
            <div>
                <h3 class="fw-bold text-dark mb-1">Quản lý Danh sách Bài tập</h3>
                <p class="text-muted small mb-0">Tìm kiếm, lọc và theo dõi hạn chót bài tập</p>
            </div>

            <div class="d-flex align-items-center gap-3 bg-white px-3 py-2 rounded border small">
                <span><span class="legend-dot bg-danger"></span>Quá hạn</span>
                <span><span class="legend-dot bg-warning"></span>Sắp đến hạn (≤ 3 ngày)</span>
                <span><span class="legend-dot bg-success"></span>Đã hoàn thành</span>
            </div>
        </div>

        <div id="deadlineWarningBanner" class="alert alert-warning d-none shadow-sm mb-4" role="alert"></div>
        <div id="alertMessage" class="alert d-none shadow-sm" role="alert"></div>

        <div class="content-card p-4 mb-4">
            <form id="filterForm" class="row g-3 align-items-end">
                <div class="col-md-4">
                    <label for="searchInput" class="form-label small fw-semibold text-secondary">Tìm kiếm bài tập</label>
                    <input type="text" class="form-control" id="searchInput" placeholder="Nhập tên bài tập cần tìm...">
                </div>

                <div class="col-md-3">
                    <label for="statusFilter" class="form-label small fw-semibold text-secondary">Trạng thái</label>
                    <select class="form-select" id="statusFilter">
                        <option value="">-- Tất cả trạng thái --</option>
                        <option value="TODO">Chưa làm (TODO)</option>
                        <option value="IN_PROGRESS">Đang làm (IN_PROGRESS)</option>
                        <option value="DONE">Hoàn thành (DONE)</option>
                    </select>
                </div>

                <div class="col-md-3">
                    <label for="subjectFilter" class="form-label small fw-semibold text-secondary">Môn học</label>
                    <select class="form-select" id="subjectFilter">
                        <option value="">-- Tất cả môn học --</option>
                    </select>
                </div>

                <div class="col-md-2 d-flex gap-2">
                    <button type="submit" class="btn btn-primary w-100">Lọc</button>
                    <button type="button" class="btn btn-outline-secondary" id="resetFilterBtn">Xóa</button>
                </div>
            </form>
        </div>

        <div class="content-card overflow-hidden">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Tiêu đề bài tập</th>
                            <th>Mô tả</th>
                            <th>Hạn chót</th>
                            <th>Trạng thái</th>
                            <th class="text-center">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody id="taskTableBody"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="/static/js/tasks.js"></script>
</body>
</html>
