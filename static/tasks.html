<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Bài tập - StudentHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- =================================================================== -->
    <!-- PHẦN 1: THANH MENU TRÊN CÙNG                                        -->
    <!-- =================================================================== -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/static/dashboard.html">📚 StudentHub</a>
            <div class="d-flex gap-2">
                <a href="/static/dashboard.html" class="btn btn-outline-info btn-sm">Dashboard</a>
                <a href="/static/subjects.html" class="btn btn-outline-light btn-sm">Quản lý Môn học</a>
                <button class="btn btn-outline-danger btn-sm" onclick="logout()">Đăng xuất</button>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>📋 Quản lý Danh sách Bài tập</h2>
        </div>

        <!-- Khung hiện thông báo -->
        <div id="alertMessage" class="alert d-none shadow-sm" role="alert"></div>

        <!-- =================================================================== -->
        <!-- PHẦN 2: THANH TÌM KIẾM VÀ BỘ LỌC (FILTER UI)                        -->
        <!-- =================================================================== -->
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <form id="filterForm" class="row g-3 align-items-end">
                    <!-- Ô nhập từ khóa tìm kiếm -->
                    <div class="col-md-4">
                        <label for="searchInput" class="form-label fw-bold">Tìm kiếm bài tập</label>
                        <input type="text" class="form-control" id="searchInput" placeholder="Nhập tên bài tập cần tìm...">
                    </div>

                    <!-- Ô lọc theo Trạng thái -->
                    <div class="col-md-3">
                        <label for="statusFilter" class="form-label fw-bold">Trạng thái</label>
                        <select class="form-select" id="statusFilter">
                            <option value="">-- Tất cả trạng thái --</option>
                            <option value="TODO">Chưa làm (TODO)</option>
                            <option value="IN_PROGRESS">Đang làm (IN_PROGRESS)</option>
                            <option value="DONE">Hoàn thành (DONE)</option>
                        </select>
                    </div>

                    <!-- Ô lọc theo Môn học (Tự động tải từ API Môn học) -->
                    <div class="col-md-3">
                        <label for="subjectFilter" class="form-label fw-bold">Môn học</label>
                        <select class="form-select" id="subjectFilter">
                            <option value="">-- Tất cả môn học --</option>
                        </select>
                    </div>

                    <!-- Nút Lọc và Đặt lại -->
                    <div class="col-md-2 d-flex gap-2">
                        <button type="submit" class="btn btn-primary w-100">Lọc</button>
                        <button type="button" class="btn btn-outline-secondary" onclick="resetFilters()">Xóa</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- =================================================================== -->
        <!-- PHẦN 3: BẢNG HIỂN THỊ DANH SÁCH BÀI TẬP                             -->
        <!-- =================================================================== -->
        <div class="card shadow-sm">
            <div class="card-body">
                <table class="table table-hover align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Tiêu đề bài tập</th>
                            <th>Mô tả</th>
                            <th>Hạn chót</th>
                            <th>Trạng thái</th>
                            <th class="text-center">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody id="taskTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- =================================================================== -->
    <!-- PHẦN 4: CODE XỬ LÝ TÌM KIẾM, LỌC VÀ HIỂN THỊ (JAVASCRIPT)           -->
    <!-- =================================================================== -->
    <script>
        const API_URL = "http://127.0.0.1:8000/tasks/";
        const SUBJECT_API_URL = "http://127.0.0.1:8000/subjects/";
        const token = localStorage.getItem("access_token");

        if (!token) {
            alert("Vui lòng đăng nhập trước!");
            window.location.href = "/static/login.html";
        }

        function getAuthHeaders() {
            return {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${token}`
            };
        }

        // BƯỚC 1: Tải danh sách Môn học đưa vào ô chọn Bộ lọc
        async function loadSubjectsForFilter() {
            try {
                const response = await fetch(SUBJECT_API_URL, { headers: getAuthHeaders() });
                if (!response.ok) return;

                const subjects = await response.json();
                const subjectSelect = document.getElementById("subjectFilter");

                subjects.forEach(sub => {
                    subjectSelect.innerHTML += `<option value="${sub.id}">${sub.code} - ${sub.name}</option>`;
                });
            } catch (err) {
                console.error("Không tải được danh sách môn học cho bộ lọc:", err);
            }
        }

        // BƯỚC 2: Gọi API Lấy danh sách bài tập (kèm từ khóa tìm kiếm & điều kiện lọc)
        async function fetchTasks() {
            try {
                // Lấy giá trị từ 3 ô lọc trên giao diện
                const search = document.getElementById("searchInput").value.trim();
                const status = document.getElementById("statusFilter").value;
                const subjectId = document.getElementById("subjectFilter").value;

                // Ghép thành chuỗi tham số trên URL (VD: ?search=bao+cao&status=TODO)
                const params = new URLSearchParams();
                if (search) params.append("search", search);
                if (status) params.append("status", status);
                if (subjectId) params.append("subject_id", subjectId);

                const requestUrl = params.toString() ? `${API_URL}?${params.toString()}` : API_URL;

                const response = await fetch(requestUrl, {
                    headers: getAuthHeaders()
                });

                if (response.status === 401) {
                    logout();
                    return;
                }

                const tasks = await response.json();
                const tbody = document.getElementById("taskTableBody");
                tbody.innerHTML = "";

                if (tasks.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="6" class="text-center text-muted py-4">Không tìm thấy bài tập nào phù hợp.</td></tr>`;
                    return;
                }

                tasks.forEach(task => {
                    const rawDate = task.due_date || task.deadline;
                    const formattedDate = rawDate ? new Date(rawDate).toLocaleDateString("vi-VN") : "---";

                    // Đổi màu nhãn trạng thái cho dễ nhìn
                    let badgeColor = "bg-secondary";
                    if (task.status === "IN_PROGRESS") badgeColor = "bg-warning text-dark";
                    if (task.status === "DONE") badgeColor = "bg-success";

                    tbody.innerHTML += `
                        <tr>
                            <td>${task.id}</td>
                            <td class="fw-bold">${task.title}</td>
                            <td>${task.description || '<span class="text-muted">Không có mô tả</span>'}</td>
                            <td>${formattedDate}</td>
                            <td><span class="badge ${badgeColor}">${task.status}</span></td>
                            <td class="text-center">
                                <button class="btn btn-sm btn-outline-danger" onclick="deleteTask(${task.id})">Xóa</button>
                            </td>
                        </tr>
                    `;
                });
            } catch (err) {
                console.error("Lỗi tải bài tập:", err);
                showAlert("Lỗi tải danh sách bài tập từ máy chủ!", "danger");
            }
        }

        // BƯỚC 3: Xử lý khi bấm nút "Lọc" hoặc nhấn Enter
        document.getElementById("filterForm").addEventListener("submit", function(e) {
            e.preventDefault();
            fetchTasks();
        });

        // Tự động lọc ngay khi đổi lựa chọn Trạng thái hoặc Môn học
        document.getElementById("statusFilter").addEventListener("change", fetchTasks);
        document.getElementById("subjectFilter").addEventListener("change", fetchTasks);

        // Nút "Xóa" bộ lọc để quay về xem toàn bộ danh sách
        function resetFilters() {
            document.getElementById("searchInput").value = "";
            document.getElementById("statusFilter").value = "";
            document.getElementById("subjectFilter").value = "";
            fetchTasks();
        }

        // Xóa bài tập
        async function deleteTask(id) {
            if (!confirm("Bạn có chắc chắn muốn xóa bài tập này không?")) return;

            try {
                const response = await fetch(`${API_URL}${id}`, {
                    method: "DELETE",
                    headers: getAuthHeaders()
                });

                if (response.ok || response.status === 204) {
                    showAlert("Xóa bài tập thành công!", "success");
                    fetchTasks();
                } else {
                    const data = await response.json();
                    showAlert(data.detail || "Không thể xóa bài tập này!", "danger");
                }
            } catch (err) {
                showAlert("Lỗi kết nối máy chủ!", "danger");
            }
        }

        function showAlert(message, type) {
            const alertMsg = document.getElementById("alertMessage");
            alertMsg.className = `alert alert-${type}`;
            alertMsg.innerText = message;
            alertMsg.classList.remove("d-none");
            setTimeout(() => alertMsg.classList.add("d-none"), 4000);
        }

        function logout() {
            localStorage.removeItem("access_token");
            window.location.href = "/static/login.html";
        }

        // Tự động chạy khi mở trang
        document.addEventListener("DOMContentLoaded", () => {
            loadSubjectsForFilter();
            fetchTasks();
        });
    </script>
</body>
</html>
