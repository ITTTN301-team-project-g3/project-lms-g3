<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Bài tập - StudentHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Thanh điều hướng -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/static/dashboard.html">📚 StudentHub</a>
            <div class="d-flex gap-2">
                <a href="/static/dashboard.html" class="btn btn-outline-info btn-sm">Dashboard</a>
                <a href="/static/subjects.html" class="btn btn-outline-light btn-sm">Quản lý Môn học</a>
                <button class="btn btn-outline-danger btn-sm" id="logoutBtn">Đăng xuất</button>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
            <h2 class="mb-0">📋 Quản lý Danh sách Bài tập</h2>

            <!-- Chú thích màu sắc trực quan -->
            <div class="d-flex align-items-center gap-3 bg-white px-3 py-2 rounded shadow-sm small">
                <span><span class="legend-dot bg-danger"></span>Quá hạn</span>
                <span><span class="legend-dot bg-warning"></span>Sắp đến hạn (≤ 3 ngày)</span>
                <span><span class="legend-dot bg-success"></span>Đã hoàn thành</span>
            </div>
        </div>

        <!-- Khung cảnh báo tự động khi có bài quá hạn hoặc sắp đến hạn -->
        <div id="deadlineWarningBanner" class="alert alert-warning d-none shadow-sm mb-4" role="alert"></div>

        <!-- Khung thông báo thao tác (xóa, lỗi...) -->
        <div id="alertMessage" class="alert d-none shadow-sm" role="alert"></div>

        <!-- Khu vực Tìm kiếm và Bộ lọc -->
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <form id="filterForm" class="row g-3 align-items-end">
                    <div class="col-md-4">
                        <label for="searchInput" class="form-label fw-bold">Tìm kiếm bài tập</label>
                        <input type="text" class="form-control" id="searchInput" placeholder="Nhập tên bài tập cần tìm...">
                    </div>

                    <div class="col-md-3">
                        <label for="statusFilter" class="form-label fw-bold">Trạng thái</label>
                        <select class="form-select" id="statusFilter">
                            <option value="">-- Tất cả trạng thái --</option>
                            <option value="TODO">Chưa làm (TODO)</option>
                            <option value="IN_PROGRESS">Đang làm (IN_PROGRESS)</option>
                            <option value="DONE">Hoàn thành (DONE)</option>
                        </select>
                    </div>

                    <div class="col-md-3">
                        <label for="subjectFilter" class="form-label fw-bold">Môn học</label>
                        <select class="form-select" id="subjectFilter">
                            <option value="">-- Tất cả môn học --</option>
                        </select>
                    </div>

                    <div class="col-md-2 d-flex gap-2">
                        <button type="submit" class="btn btn-primary w-100">Lọc</button>
                        <button type="button" class="btn btn-outline-secondary" id="resetFilterBtn">Xóa</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Bảng hiển thị danh sách bài tập -->
        <div class="card shadow-sm">
            <div class="card-body">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Tiêu đề bài tập</th>
                            <th>Mô tả</th>
                            <th>Hạn chót</th>
                            <th>Trạng thái</th>
                            <th class="text-center">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody id="taskTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="/static/js/tasks.js"></script>
</body>
</html>
