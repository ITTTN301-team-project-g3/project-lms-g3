<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Danh sách Bài tập</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>📋 Quản lý Danh sách Bài tập</h2>
            <a href="/static/dashboard.html" class="btn btn-outline-secondary">Trang chủ</a>
        </div>

        <!-- Khu vực hiển thị thông báo lỗi/thành công -->
        <div id="alertMessage" class="alert d-none shadow-sm" role="alert"></div>

        <!-- Bảng hiển thị danh sách bài tập -->
        <div class="card shadow-sm">
            <div class="card-body">
                <table class="table table-hover align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Tiêu đề</th>
                            <th>Mô tả</th>
                            <th>Hạn chót</th>
                            <th>Trạng thái</th>
                            <th class="text-center">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody id="taskTableBody">
                        <!-- Dữ liệu sẽ được JavaScript tự động đổ vào đây -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- JavaScript tích hợp gọi API -->
    <script>
        document.addEventListener('DOMContentLoaded', fetchTasks);

        // Lấy Token xác thực từ LocalStorage
        const token = localStorage.getItem('access_token');
        if (!token) {
            window.location.href = '/static/login.html';
        }

        // 1. Hàm gọi API lấy danh sách bài tập (GET /tasks/)
        async function fetchTasks() {
            try {
                const response = await fetch('/tasks/', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (response.status === 401) {
                    window.location.href = '/static/login.html';
                    return;
                }

                const tasks = await response.json();
                const tbody = document.getElementById('taskTableBody');
                tbody.innerHTML = '';

                if (tasks.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="6" class="text-center text-muted">Chưa có bài tập nào.</td></tr>`;
                    return;
                }

                tasks.forEach(task => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${task.id}</td>
                            <td class="fw-bold">${task.title}</td>
                            <td>${task.description || '---'}</td>
                            <td>${task.deadline ? new Date(task.deadline).toLocaleDateString() : '---'}</td>
                            <td><span class="badge bg-primary">${task.status}</span></td>
                            <td class="text-center">
                                <button class="btn btn-sm btn-danger" onclick="deleteTask(${task.id})">Xóa</button>
                            </td>
                        </tr>
                    `;
                });
            } catch (err) {
                showAlert('Lỗi tải danh sách bài tập từ máy chủ!', 'danger');
            }
        }

        // 2. Hàm gọi API Xóa bài tập (DELETE /tasks/{id})
        async function deleteTask(id) {
            if (!confirm('Bạn có chắc chắn muốn xóa bài tập này không?')) return;

            try {
                const response = await fetch(`/tasks/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok || response.status === 204) {
                    showAlert('Xóa bài tập thành công!', 'success');
                    fetchTasks(); // Tải lại bảng sau khi xóa
                } else {
                    const data = await response.json();
                    showAlert(data.detail || 'Không thể xóa bài tập này!', 'danger');
                }
            } catch (err) {
                showAlert('Lỗi kết nối máy chủ!', 'danger');
            }
        }

        // Hàm hỗ trợ hiện thông báo
        function showAlert(message, type) {
            const alertMsg = document.getElementById('alertMessage');
            alertMsg.className = `alert alert-${type}`;
            alertMsg.innerText = message;
            alertMsg.classList.remove('d-none');
            setTimeout(() => alertMsg.classList.add('d-none'), 4000);
        }
    </script>
</body>
</html>
